name: Build & Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOCKERHUB_USER: mrsawy

jobs:
  # ── Build images in parallel ────────────────────────────────────────

  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/DockerFile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/lms-server:latest
            ${{ env.DOCKERHUB_USER }}/lms-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          # mode=min: only cache the final image (avoids multi-GB intermediate exports).
          cache-to: type=gha,mode=min,scope=server

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/DockerFile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/lms-client:latest
            ${{ env.DOCKERHUB_USER }}/lms-client:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_S3_BUCKET_NAME=${{ secrets.NEXT_PUBLIC_S3_BUCKET_NAME }}
            NEXT_PUBLIC_S3_REGION=${{ secrets.NEXT_PUBLIC_S3_REGION }}
            NEXT_PUBLIC_CLOUDFRONT_DOMAIN=${{ secrets.NEXT_PUBLIC_CLOUDFRONT_DOMAIN }}
          cache-from: type=gha,scope=client
          # mode=min: only cache the final image (avoids multi-GB intermediate exports).
          cache-to: type=gha,mode=min,scope=client

  # ── Deploy to EC2 ──────────────────────────────────────────────────

  deploy:
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + Caddyfile to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: ~/lms

      - name: Pull new images & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/lms
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
