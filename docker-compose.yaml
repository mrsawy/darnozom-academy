services:
  server:
    build:
      context: apps/server
      dockerfile: DockerFile
    ports:
      - '3000:3000'
    # MongoDB is hosted on Atlas: MONGODB_URI_DEV comes from apps/server/.env.
    # Values under environment: win over env_file, so the Docker-network URLs below stick.
    env_file:
      - apps/server/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NATS_URLS=nats://nats:4222
      - REDIS_URL_DEV=redis://redis:6379
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/server:/app
      - /app/node_modules
    command: ['pnpm', 'start']
    depends_on:
      - nats
      - redis

  client:
    build:
      context: apps/client
      dockerfile: DockerFile
    ports:
      - '3001:3000'
    environment:
      - NATS_URLS=nats://nats:4222
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    command: ['pnpm', 'dev']
    depends_on:
      - nats

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    ports:
      # Host publishes 6380 so Nest/Next on the machine can use redis://127.0.0.1:6380
      # (container still listens on 6379 inside the Docker network)
      - '127.0.0.1:6380:6379'
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - '4222:4222'
      - '8222:8222'
    command: ['--jetstream', '--http_port', '8222']
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redisdata: