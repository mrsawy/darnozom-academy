services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - '3000:3000'
    # apps/server/.env supplies secrets (Mongo URI, JWT secrets, Google OAuth, etc).
    env_file:
      - apps/server/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - NATS_URLS=nats://nats:4222
    volumes:
      - ./apps/server:/app
      - /app/node_modules
    command: ['pnpm', 'start']
    depends_on:
      - nats
      - mongo

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - '5550:5550'
    environment:
      - NATS_URLS=nats://nats:4222
      - INTERNAL_API_URL=http://server:3000
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    command: ['pnpm', 'dev']
    depends_on:
      - server

  mongo:
    image: mongo:7
    container_name: islamic-academy-mongo
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    ports:
      - '4222:4222'
      - '8222:8222'
    command: ['--jetstream', '--http_port', '8222']
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8222/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
